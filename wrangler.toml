# ==============================================================================
# Cloudflare Pages Configuration (wrangler.toml)
# MyArea24 Hyperlocal Community & Commerce Platform
# ==============================================================================

name = "myarea24"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
ENVIRONMENT = "production"
VITE_API_BASE_URL = "https://api.myarea24.in"

# Preview deployment environment override
[env.preview.vars]
ENVIRONMENT = "preview"
VITE_API_BASE_URL = "https://staging-api.myarea24.in"

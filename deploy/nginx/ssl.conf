# ==============================================================================
# MyArea24 — Production Nginx SSL Configuration (Let's Encrypt TLS + Edge Gateway)
# Domains: myarea24.in, www.myarea24.in, api.myarea24.in
# Architecture:
#   - Port 80: Automated Let's Encrypt ACME HTTP-01 verification & HTTPS 301 redirect
#   - Port 443: Mozilla Modern TLSv1.2/TLSv1.3 with HSTS
#   - Upstream: 2 Uvicorn Worker cluster on FastAPI backend
#   - Static SPA: Client-side routing with immutable fingerprinted assets
# ==============================================================================

# Rate limiting zones: 50 req/sec general API, 10 req/sec for OTP authentication
limit_req_zone $binary_remote_addr zone=ssl_prod_api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=ssl_prod_auth:10m rate=10r/s;

upstream fastapi_production_cluster {
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# 1. HTTP Listener: ACME HTTP-01 Challenge + Strict HTTPS Redirection
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name myarea24.in www.myarea24.in api.myarea24.in;

    # Automated Let's Encrypt / Certbot challenge resolver
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Permanent 301 Redirect to HTTPS for all traffic
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. API Gateway Subdomain: api.myarea24.in
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.myarea24.in;

    # Let's Encrypt Automated TLS Certificates
    ssl_certificate /etc/letsencrypt/live/myarea24.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myarea24.in/privkey.pem;

    # Mozilla Modern TLS Security Directives
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_API:10m;
    ssl_session_tickets off;

    # HTTP Strict Transport Security (HSTS) - 1 Year Preloaded
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Unthrottled Container Health Check
    location = /health {
        proxy_pass http://fastapi_production_cluster/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    # Dedicated Rate Limiting for Auth OTP Endpoints (Brute-force protection)
    location /api/v1/auth/otp/ {
        limit_req zone=ssl_prod_auth burst=5 nodelay;
        proxy_pass http://fastapi_production_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Real-Time WebSocket Gateway (Merchant Order Broadcasts & Chimes)
    location /api/v1/ws {
        proxy_pass http://fastapi_production_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # General Production API Proxying (2 Uvicorn Workers)
    location / {
        limit_req zone=ssl_prod_api burst=20 nodelay;
        proxy_pass http://fastapi_production_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        client_max_body_size 15M;
    }
}

# ------------------------------------------------------------------------------
# 3. Main Frontend & SPA Server: myarea24.in and www.myarea24.in
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myarea24.in www.myarea24.in;

    # Let's Encrypt Automated TLS Certificates
    ssl_certificate /etc/letsencrypt/live/myarea24.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myarea24.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_WWW:10m;
    ssl_session_tickets off;

    # Strict Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/x-javascript
        application/xml application/xml+rss image/svg+xml;

    # Vite Fingerprinted Assets: 1-Year Immutable Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # PWA Service Worker: Revalidate Immediately
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        default_type application/javascript;
    }

    # Web Manifest: Edge Revalidation
    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        default_type application/manifest+json;
    }

    # Inline API Proxying (Allows frontend to call /api/ directly)
    location /api/ {
        limit_req zone=ssl_prod_api burst=20 nodelay;
        proxy_pass http://fastapi_production_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        client_max_body_size 15M;
    }

    # WebSocket Proxying
    location /api/v1/ws {
        proxy_pass http://fastapi_production_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA Client-Side Routing: Serve index.html for all frontend paths
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

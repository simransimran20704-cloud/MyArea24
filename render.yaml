services:
  - type: web
    name: myarea24-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    plan: standard
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: myarea24-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://myarea24.pages.dev,https://myarea24.in,http://localhost:5173"
      - key: WEB_CONCURRENCY
        value: "2"

  - type: static
    name: myarea24-frontend
    staticPublishPath: dist
    buildCommand: npm run build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: myarea24-postgres
    plan: standard
    region: singapore
    postgresMajorVersion: 16
